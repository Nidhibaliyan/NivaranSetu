name: Legal RAG integration checks

on:
  workflow_dispatch:
  push:
    branches:
      - feature/legal-rag-integration
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: TypeScript validation
        run: npm run lint
      - name: Production frontend build
        run: npm run build
